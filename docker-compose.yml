services:
  db:
    image: postgres:16
    container_name: discount-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: discount
      POSTGRES_USER: discount_user
      POSTGRES_PASSWORD: change_me_local
    ports:
      - "5432:5432"
    volumes:
      - discount_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discount_user -d discount"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  discount_pgdata:
